<title>Matemática Visual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,500;1,400;1,600&display=swap">
<style>
/* Layout: figura à esquerda e quadro à direita (como nas aulas em vídeo). No celular: figura, controles, quadro. */
:root{
  --bg:#000; --ink:#fff; --ink-dim:#cfcfcf; --line:#f2f2f2;
  --red:#ff2a2a; --red-deep:#e50000;  /* destaque da interface */
  --arc:#4fe3ff;   /* arco */
  --ang:#ffd45e;   /* ângulo */
  --res:#7dee9b;   /* resultado */
  --ab:#ffd45e; --cd:#c4a6ff;  /* cordas */
  --alt:#ff9ec9;   /* altura */
  --panel:rgba(255,255,255,.08); --panel-line:rgba(255,255,255,.24);
  --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --math:'STIX Two Text',Cambria,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-block:12px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:grid;gap:10px}
h1{margin:0;text-align:center;font-weight:600;font-size:clamp(18px,4.2vw,26px);text-wrap:balance}
.tabs{display:flex;flex-wrap:nowrap;justify-content:safe center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:599px){h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
.tab{flex:none;white-space:nowrap;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--panel-line);background:transparent;color:var(--ink-dim);font:600 15px var(--sans);cursor:pointer}
.tab[aria-current="true"]{color:var(--ink);border-color:var(--red);background:rgba(255,42,42,.2)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.stage{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"fig" "ctrl" "board"}
@media (min-width:820px){
  .stage{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"fig board" "fig ctrl";grid-template-rows:auto 1fr;align-items:start}
}
.fig{grid-area:fig;width:100%;max-width:560px;max-height:70vh;aspect-ratio:1;margin-inline:auto;border:1px solid var(--panel-line);border-radius:14px;background:rgba(255,255,255,.035)}
.fig svg{width:100%;height:100%;display:block}

.board{grid-area:board;display:grid;gap:12px;align-content:start;min-width:0}
.sub{margin:0;font-family:var(--math);font-style:italic;font-size:clamp(24px,5.4vw,32px)}
.say{margin:0;min-height:3.1em;font-size:clamp(16px,3.7vw,19px);color:var(--ink-dim);animation:rise .45s both}
.lines{display:grid;gap:10px;justify-items:start}
.line{font-family:var(--math);font-style:italic;font-size:clamp(25px,6.2vw,36px);line-height:1.25;animation:rise .5s both}
.tag{font-family:var(--math);font-style:italic;font-size:clamp(20px,5vw,26px);padding:6px 24px;border-radius:10px;background:rgba(255,42,42,.2);border:1px solid rgba(255,42,42,.6);animation:rise .5s both}
.frac{display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15}
.frac>span:first-child{border-bottom:2px solid var(--ink);padding:0 .25em .05em}
.c-arc{color:var(--arc)} .c-ang{color:var(--ang)} .c-res{color:var(--res)} .c-ab{color:var(--ab)} .c-cd{color:var(--cd)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ctrl{grid-area:ctrl;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.btn{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--panel-line);background:var(--panel);color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.btn.main{background:var(--red-deep);color:#fff;border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.groups .tab{font-size:14px;padding:0 12px;min-height:44px}
@media (min-width:600px){.groups .tab{font-size:16px;padding:0 16px;min-height:46px}}
.ln-ab2{stroke:var(--ab);stroke-width:3.4}
.c-alt{color:var(--alt)}
.ln-cd2{stroke:var(--cd);stroke-width:3.2}
.ln-alt{stroke:var(--alt);stroke-width:3.2}
.ln-arc2{stroke:var(--alt);stroke-width:7}
.lbl.dim{fill:var(--ink-dim)}
.ring-v{fill:none;stroke:var(--cd);stroke-width:3.5}
.die-hi{fill:rgba(79,227,255,.26)}
.lbl.sm{font-size:18px} .lbl.big{font-size:44px} .lbl.c-alt{fill:var(--alt)}
.bag{fill:rgba(255,255,255,.07);stroke:var(--line);stroke-width:2.5}
.ball-n{fill:rgba(255,255,255,.26);stroke:var(--line);stroke-width:1.5}
.ball-r{fill:#ff5d6c}.ball-b{fill:#4a9bff}.ball-g{fill:#5be08b}
.ring{fill:none;stroke:var(--ang);stroke-width:3.5}
.ring-c{fill:none;stroke:var(--arc);stroke-width:2.5;stroke-dasharray:5 5}
.die{fill:rgba(255,255,255,.1);stroke:var(--line);stroke-width:2.5}
.tri{fill:rgba(255,255,255,.1);stroke:var(--line);stroke-width:2.5;stroke-linejoin:round}
.dash-alt{fill:none;stroke:var(--alt);stroke-width:2.5;stroke-dasharray:6 6}
.btn.extra{grid-column:1/-1;border-color:var(--ang);color:var(--ang)}
.dots{display:flex;justify-content:center;flex-wrap:nowrap;min-width:0}
.dot{flex:0 1 18px;min-width:9px;height:34px;padding:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot[aria-current="true"]::before{background:var(--red);box-shadow:0 0 0 4px rgba(255,42,42,.3)}

/* figura */
.el{opacity:0;transition:opacity .5s ease}
.el.on{opacity:1}
.draw{fill:none;stroke-dasharray:1;stroke-dashoffset:1;opacity:1;transition:stroke-dashoffset .9s ease}
.draw.on{stroke-dashoffset:0}
.circ{fill:url(#cg);stroke:var(--line);stroke-width:2.5}
.ln{stroke:var(--line);stroke-width:2.5}
.ln-arc{stroke:var(--arc);stroke-width:7}
.ln-ang{stroke:var(--ang);stroke-width:2.8}
.ln-ab{stroke:var(--ab);stroke-width:6}
.ln-cd{stroke:var(--cd);stroke-width:6}
.ln-res{stroke:var(--res);stroke-width:3}
.dash{fill:none;stroke:var(--ang);stroke-width:2;stroke-dasharray:6 6}
.wedge{fill:rgba(255,212,94,.24)}
.pt{fill:var(--ink)}
.lbl{font-family:var(--math);font-style:italic;font-size:24px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#000;stroke-width:4px;stroke-linejoin:round}
.lbl.c-arc{fill:var(--arc)} .lbl.c-ang{fill:var(--ang)} .lbl.c-res{fill:var(--res)} .lbl.c-ab{fill:var(--ab)} .lbl.c-cd{fill:var(--cd)}
.grid{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1}
.ax{fill:none;stroke:var(--line);stroke-width:2}
.fn{stroke:var(--red);stroke-width:4.5}
.fn2{stroke:var(--arc);stroke-width:3.5}
.lbl.c-red{fill:var(--red)} .c-red{color:var(--red)}
.arw-x{fill:none;stroke:var(--alt);stroke-width:3.5}
.glow2{stroke:rgba(255,255,255,.5);stroke-width:9;stroke-linecap:round}
.glow{stroke:rgba(255,255,255,.5);stroke-width:15;stroke-linecap:round}
.pt.hot{fill:var(--red)}
.lbl.tk{font-size:13px;fill:var(--ink-dim);font-style:normal;stroke-width:3px}
.setb{fill:rgba(255,255,255,.07);stroke:var(--line);stroke-width:2.5}
.setb.hi{stroke:var(--ang);stroke-width:4;fill:rgba(255,212,94,.12)}
.setb.hi2{stroke:var(--arc);stroke-width:4;fill:rgba(79,227,255,.1)}
.arw-dim{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.5}
.arw{fill:none;stroke:var(--red);stroke-width:3.5}
.sq-arc{fill:rgba(79,227,255,.16);stroke:var(--arc);stroke-width:2.5;stroke-linejoin:round}
.sq-cd{fill:rgba(196,166,255,.16);stroke:var(--cd);stroke-width:2.5;stroke-linejoin:round}
.wall{fill:rgba(255,255,255,.12);stroke:var(--line);stroke-width:2.5}
.tt{border-collapse:collapse;font-family:var(--math);font-size:19px;margin-top:4px}
.tt th,.tt td{border:1px solid var(--panel-line);padding:4px 10px;text-align:center}
.tt th{color:var(--red);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<main class="app">
  <header class="top">
    <nav class="tabs groups" id="groups" aria-label="Escolha a página"></nav>
    <h1 id="title">Ângulos e cordas na circunferência</h1>
    <nav class="tabs" id="tabs" aria-label="Escolha a cena"></nav>
  </header>
  <section class="stage">
    <div class="fig">
      <svg id="fig" viewBox="0 0 400 400" role="img" aria-label="Figura da circunferência">
        <defs>
          <radialGradient id="cg" cx="50%" cy="45%" r="60%">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
          </radialGradient>
        </defs>
        <g id="scene"></g>
      </svg>
    </div>
    <div class="board">
      <p class="sub" id="sub"></p>
      <p class="say" id="say" aria-live="polite"></p>
      <div class="lines" id="lines"></div>
    </div>
    <div class="ctrl">
      <button class="btn" id="prev" aria-label="Passo anterior">←</button>
      <div class="dots" id="dots"></div>
      <button class="btn main" id="next">Próximo →</button>
      <button class="btn extra" id="extra" hidden></button>
    </div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const O={x:200,y:200,r:150};
const rad=d=>d*Math.PI/180;
const f=n=>Math.round(n*100)/100;
const P=(deg,r=O.r)=>[O.x+r*Math.cos(rad(deg)),O.y-r*Math.sin(rad(deg))];
const at=(v,deg,d)=>[v[0]+d*Math.cos(rad(deg)),v[1]-d*Math.sin(rad(deg))];
const dirDeg=(a,b)=>Math.atan2(a[1]-b[1],b[0]-a[0])*180/Math.PI;
const M=p=>f(p[0])+' '+f(p[1]);
const lineD=(p,q)=>'M '+M(p)+' L '+M(q);
/* arco anti-horário de a1 até a2 (graus), centro (cx,cy) */
function arcD(a1,a2,r,cx=O.x,cy=O.y){
  const s=((a2-a1)%360+360)%360;
  const p1=[cx+r*Math.cos(rad(a1)),cy-r*Math.sin(rad(a1))];
  const p2=[cx+r*Math.cos(rad(a1+s)),cy-r*Math.sin(rad(a1+s))];
  return 'M '+M(p1)+' A '+r+' '+r+' 0 '+(s>180?1:0)+' 0 '+M(p2);
}
function sectD(a1,a2,r){
  const s=((a2-a1)%360+360)%360, p1=P(a1,r), p2=P(a1+s,r);
  return 'M '+O.x+' '+O.y+' L '+M(p1)+' A '+r+' '+r+' 0 '+(s>180?1:0)+' 0 '+M(p2)+' Z';
}
/* arco pequeno no vértice v, entre as direções para a e b */
function angleAt(v,a,b,r){
  let a1=dirDeg(v,a),a2=dirDeg(v,b),s=((a2-a1)%360+360)%360;
  if(s>180){const t=a1;a1=a2;a2=t;s=360-s;}
  return {d:arcD(a1,a1+s,r,v[0],v[1]),mid:a1+s/2};
}
function rightD(v,a,b,k){
  const ua=[(a[0]-v[0]),(a[1]-v[1])],ub=[(b[0]-v[0]),(b[1]-v[1])];
  const la=Math.hypot(...ua),lb=Math.hypot(...ub);
  const p=[v[0]+ua[0]/la*k,v[1]+ua[1]/la*k],q=[p[0]+ub[0]/lb*k,p[1]+ub[1]/lb*k],r=[v[0]+ub[0]/lb*k,v[1]+ub[1]/lb*k];
  return 'M '+M(p)+' L '+M(q)+' L '+M(r);
}

/* criação de elementos: s = passo em que aparece, e = passo em que some */
let SC=$('scene');
function mk(tag,attrs,s=0,e=99,cls=''){
  const el=document.createElementNS(NS,tag);
  for(const k in attrs)el.setAttribute(k,attrs[k]);
  el.setAttribute('class',('el '+cls).trim());
  el.dataset.s=s;el.dataset.e=e;SC.appendChild(el);return el;
}
const path=(d,s,cls,e)=>mk('path',{d,pathLength:1},s,e,'draw '+cls);
const seg=(p,q,s,cls,e)=>path(lineD(p,q),s,cls,e);
const dot=(p,s,e)=>mk('circle',{cx:f(p[0]),cy:f(p[1]),r:4.5},s,e,'pt');
const txt=(p,t,s,cls,e)=>{const el=mk('text',{x:f(p[0]),y:f(p[1])},s,e,'lbl '+cls);el.textContent=t;return el;};
const base=(s=0)=>mk('circle',{cx:O.x,cy:O.y,r:O.r},s,99,'circ');

/* fundo: ondas de pontos, como no vídeo */
function paintBg(){
  const c=$('bg'),x=c.getContext('2d'),d=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
  const g=x.createRadialGradient(w*.5,h*.38,0,w*.5,h*.38,Math.max(w,h)*.75);
  g.addColorStop(0,'rgba(170,0,0,.38)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const step=Math.max(6,w/150);
  for(let r=0;r<34;r++){
    const t=r/33;
    for(let px=-step;px<=w+step;px+=step){
      const u=px/w;
      const y=h*(.52+.2*Math.sin(u*5.4+t*1.6)+.08*Math.sin(u*11+t*3))+(t-.5)*h*.34;
      const a=.1+.38*Math.pow(Math.sin(Math.PI*t),1.4)*rnd();
      x.fillStyle=rnd()>.9?'rgba(255,255,255,'+a+')':'rgba(255,40,40,'+a+')';
      x.beginPath();x.arc(px+rnd()*3,y+rnd()*3,.7+rnd()*.9,0,6.283);x.fill();
    }
  }
  for(let i=0;i<24;i++){
    x.fillStyle='rgba(255,60,60,'+(.03+rnd()*.07)+')';
    x.beginPath();x.arc(rnd()*w,rnd()*h,4+rnd()*12,0,6.283);x.fill();
  }
}
paintBg();
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(paintBg,150);});
const F=(a,b)=>'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>';
const arcS='<span class="c-arc">arco</span>';
const SCENES=[];

SCENES.push({id:'central',tab:'Central',sub:'Ângulo central',
  build(){
    const A=P(30),B=P(110),Oc=[O.x,O.y];
    base();
    dot(Oc,0);txt([O.x+16,O.y+18],'O',0);
    dot(A,1);dot(B,1);txt(at(A,30,22),'A',1);txt(at(B,110,22),'B',1);
    path(arcD(30,110,150),2,'ln-arc');
    txt(P(70,180),'80°',2,'c-arc');
    mk('path',{d:sectD(30,110,150)},3,99,'wedge');
    seg(Oc,A,3,'ln-ang');seg(Oc,B,3,'ln-ang');
    path(arcD(30,110,34),3,'ln-ang');
    txt(P(70,62),'α',3,'c-ang',5);
    txt(P(70,62),'80°',5,'c-res');
  },
  steps:[
    {say:'Esta é uma circunferência. O ponto O é o centro.'},
    {say:'Marque dois pontos nela: A e B.'},
    {say:'O pedaço da circunferência entre A e B é o arco AB. Aqui ele mede 80°.'},
    {say:'Ligue A e B ao centro. O ângulo entre os dois raios é o ângulo central.'},
    {say:'Regra: o ângulo central mede o mesmo que o arco.',
     add:['<span class="c-ang">α</span> = '+arcS]},
    {say:'Agora com os números.',
     add:['T:Exemplo','<span class="c-arc">arco AB</span> = 80°','<span class="c-ang">α</span> = <span class="c-res">80°</span>']}
  ]});

SCENES.push({id:'inscrito',tab:'Inscrito',sub:'Ângulo inscrito',
  build(){
    const A=P(30),B=P(110),C=P(250),Oc=[O.x,O.y];
    base();
    dot(A,0);dot(B,0);txt(at(A,30,22),'A',0);txt(at(B,110,22),'B',0);
    path(arcD(30,110,150),0,'ln-arc');txt(P(70,180),'80°',0,'c-arc');
    dot(C,1);txt(at(C,250,22),'C',1);
    seg(C,A,2,'ln-ang');seg(C,B,2,'ln-ang');
    const g=angleAt(C,A,B,40);path(g.d,2,'ln-ang');
    txt(at(C,g.mid,78),'θ',2,'c-ang',5);txt(at(C,g.mid,78),'40°',5,'c-res');
    dot(Oc,3);txt([O.x+16,O.y+18],'O',3);
    mk('path',{d:lineD(Oc,A)},3,99,'dash');mk('path',{d:lineD(Oc,B)},3,99,'dash');
    mk('path',{d:arcD(30,110,34)},3,99,'dash');
    txt(P(70,64),'80°',3,'c-ang');
  },
  steps:[
    {say:'Usamos o mesmo arco AB, de 80°.',add:['<span class="c-arc">arco AB = 80°</span>']},
    {say:'Agora marque um ponto C do outro lado da circunferência.'},
    {say:'Ligue C a A e a B. O ângulo em C é o ângulo inscrito.'},
    {say:'Compare: o ângulo central desse arco mede 80°. O ângulo em C é bem menor.'},
    {say:'Regra: o ângulo inscrito mede a metade do arco.',
     add:['<span class="c-ang">θ</span> = '+F(arcS,'2')]},
    {say:'Agora com os números.',
     add:['T:Exemplo','<span class="c-ang">θ</span> = '+F('80°','2'),'<span class="c-ang">θ</span> = <span class="c-res">40°</span>']}
  ]});
let placeC=null,cDeg=70,cIdx=0,tw=0;
SCENES.push({id:'diametro',tab:'Diâmetro',sub:'Ângulo no diâmetro',
  extra:{label:'Mover o ponto C',show:s=>s>=4,
    click(){
      const to=[70,125,28,150][++cIdx%4],from=cDeg,t0=performance.now();
      cancelAnimationFrame(tw);
      const run=now=>{const k=Math.min(1,(now-t0)/700),e=k*k*(3-2*k);cDeg=from+(to-from)*e;placeC&&placeC(cDeg);if(k<1)tw=requestAnimationFrame(run);};
      tw=requestAnimationFrame(run);
    }},
  build(){
    cDeg=70;cIdx=0;cancelAnimationFrame(tw);
    const A=P(180),B=P(0),Oc=[O.x,O.y];
    base();
    seg(A,B,0,'ln');
    dot(Oc,0);txt([O.x,O.y+22],'O',0);
    dot(A,0);dot(B,0);txt(at(A,180,22),'A',0);txt(at(B,0,22),'B',0);
    path(arcD(180,360,150),1,'ln-arc');txt(P(270,178),'180°',1,'c-arc');
    const cA=seg(A,A,2,'ln-ang'),cB=seg(B,B,2,'ln-ang');
    const cDot=dot(A,2),cLbl=txt(A,'C',2);
    const rm=path('M 0 0',3,'ln-res'),rl=txt(A,'90°',3,'c-res');
    placeC=deg=>{
      const C=P(deg),L=P(deg,172),g=angleAt(C,A,B,1),m=at(C,g.mid,40);
      cDot.setAttribute('cx',f(C[0]));cDot.setAttribute('cy',f(C[1]));
      cLbl.setAttribute('x',f(L[0]));cLbl.setAttribute('y',f(L[1]));
      cA.setAttribute('d',lineD(C,A));cB.setAttribute('d',lineD(C,B));
      rm.setAttribute('d',rightD(C,A,B,15));
      rl.setAttribute('x',f(m[0]));rl.setAttribute('y',f(m[1]));
    };
    placeC(cDeg);
  },
  steps:[
    {say:'AB é um diâmetro: uma corda que passa pelo centro O.'},
    {say:'Ele divide a circunferência em dois arcos de 180°.',add:['<span class="c-arc">arco AB = 180°</span>']},
    {say:'Marque um ponto C no outro arco e ligue C a A e a B.'},
    {say:'O ângulo em C é inscrito: mede a metade do arco.',
     add:['<span class="c-ang">θ</span> = '+F('180°','2'),'<span class="c-ang">θ</span> = <span class="c-res">90°</span>']},
    {say:'Mova o ponto C e veja: o ângulo continua 90°.',add:['<span class="c-res">sempre 90°</span>']}
  ]});

/* ponto P fora da circunferência (raio 5, escala 18, centro em x=150) */
const EX=21,CX=130;
const Qx=(x,y)=>[CX+x*EX,O.y-y*EX];
const ray=(p,th,t)=>Qx(p[0]+t*Math.cos(rad(th)),p[1]+t*Math.sin(rad(th)));
const circX=()=>mk('circle',{cx:CX,cy:O.y,r:5*EX},0,99,'circ');
const radial=p=>dirDeg([CX,O.y],p);
/* colchete de medida de p até q, afastado de "away"; devolve o ponto do meio */
function dim(p,q,off,away,cls,s,e){
  const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy),m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
  let n=[-dy/L,dx/L];
  const d1=Math.hypot(m[0]+n[0]*10-away[0],m[1]+n[1]*10-away[1]);
  const d2=Math.hypot(m[0]-n[0]*10-away[0],m[1]-n[1]*10-away[1]);
  if(d2>d1)n=[-n[0],-n[1]];
  const a=[p[0]+n[0]*off,p[1]+n[1]*off],b=[q[0]+n[0]*off,q[1]+n[1]*off];
  path('M '+M(p)+' L '+M(a)+' L '+M(b)+' L '+M(q),s,cls,e);
  return [(a[0]+b[0])/2+n[0]*14,(a[1]+b[1])/2+n[1]*14];
}

}

function arrD(p,q,h=9){
  const a=Math.atan2(q[1]-p[1],q[0]-p[0]);
  const h1=[q[0]-h*Math.cos(a-.45),q[1]-h*Math.sin(a-.45)],h2=[q[0]-h*Math.cos(a+.45),q[1]-h*Math.sin(a+.45)];
  return lineD(p,q)+' M '+M(h1)+' L '+M(q)+' L '+M(h2);
}

/* quadrado construído sobre o segmento pq, para o lado oposto a ref */
function sqOn(p,q,ref,cls,s,e){
  const dx=q[0]-p[0],dy=q[1]-p[1],mid=[(p[0]+q[0])/2,(p[1]+q[1])/2];
  let nx=-dy,ny=dx;
  if((ref[0]-mid[0])*nx+(ref[1]-mid[1])*ny>0){nx=-nx;ny=-ny;}
  const p2=[p[0]+nx,p[1]+ny],q2=[q[0]+nx,q[1]+ny];
  mk('path',{d:'M '+M(p)+' L '+M(q)+' L '+M(q2)+' L '+M(p2)+' Z'},s,e,cls);
  return [(p[0]+q2[0])/2,(p[1]+q2[1])/2];
}

    {say:'O valor de delta mostra quantas raízes reais existem. Se Δ é positivo, são duas. Se é zero, uma só. Se é negativo, a raiz quadrada de Δ não é um número real, e então não existem raízes reais.',
     add:['T:Quantas raízes?','Δ &gt; 0 → <span class="c-res">duas raízes reais</span>','Δ = 0 → uma raiz real (só toca o eixo)','Δ &lt; 0 → √Δ <span class="c-alt">não é real</span>: nenhuma raiz real']},
    {say:'Exemplo com Δ negativo: f(x) = x² − 2x + 3. Os coeficientes são a = 1, b = −2 e c = 3. Nenhum número real elevado ao quadrado dá −8, então a raiz não é real e a parábola não toca o eixo x.',
     add:['T:Exemplo com Δ &lt; 0','x<sup>2</sup> − 2x + 3 = 0 → a = 1, b = −2, c = 3','Δ = (−2)<sup>2</sup> − 4 · 1 · 3 = 4 − 12 = <span class="c-alt">−8</span>','x = '+F('2 ± √(−8)','2'),'√(−8) <span class="c-alt">não é real</span>','<span class="c-alt">sem raízes reais</span>: a parábola não corta o eixo x']},
    {say:'Voltando ao exemplo principal. Vértice, passo 1: o x do vértice fica no meio das raízes. Use x do vértice = −b dividido por 2a.',
     add:['T:Vértice · Passo 1','x<sub>v</sub> = '+F('−'+cB('b'),'2'+cA('a')),'x<sub>v</sub> = '+F('−('+cB('−2')+')','2 · '+cA('1'))+' = '+F('2','2')+' = <span class="c-res">1</span>']},
    {say:'Passo 2: o y do vértice é −delta dividido por 4a. O vértice é o ponto mais baixo da parábola.',
     add:['T:Passo 2','y<sub>v</sub> = '+F('−Δ','4'+cA('a')),'y<sub>v</sub> = '+F('−16','4 · '+cA('1'))+' = <span class="c-res">−4</span>','V = <span class="c-ab">(1, −4)</span>']}
  ]});

/* ===== ângulos excêntricos ===== */
const inter=(a,b,c,e)=>{
  const t=((a[0]-c[0])*(c[1]-e[1])-(a[1]-c[1])*(c[0]-e[0]))/((a[0]-b[0])*(c[1]-e[1])-(a[1]-b[1])*(c[0]-e[0]));
  return [a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])];
};
SCENES.push({id:'interno',tab:'Ângulo interno',sub:'Ângulo excêntrico interno',
  build(){
    const A=P(100),B=P(250),C=P(20),D=P(200),Pp=inter(A,B,C,D);
    base();
    seg(A,B,0,'ln');seg(C,D,0,'ln');
    dot(A,0);dot(B,0);dot(C,0);dot(D,0);dot(Pp,0);
    [[100,'A'],[250,'B'],[20,'C'],[200,'D']].forEach(([g,t])=>txt(P(g,172),t,0));
    txt(at(Pp,-62,16),'P',0);
    const a1=angleAt(Pp,A,C,26);
    path(a1.d,1,'ln-ang');txt(at(Pp,a1.mid,46),'α',1,'c-ang',5);txt(at(Pp,a1.mid,46),'65°',5,'c-res');
    path(arcD(20,100,150),2,'ln-arc');txt(P(60,128),'80°',2,'c-arc');
    const a2=angleAt(Pp,B,D,26);
    path(a2.d,3,'ln-ang');
    path(arcD(200,250,150),3,'ln-cd');txt(P(225,128),'50°',3,'c-cd');
  },
  steps:[
    {say:'Duas cordas, AB e CD, se cruzam no ponto P, dentro da circunferência.'},
    {say:'O ângulo α, de vértice P, está dentro do círculo. Ele se chama ângulo excêntrico interno.',
     add:['<span class="c-ang">α</span> = ângulo <span class="c-ang">excêntrico interno</span>']},
    {say:'O ângulo α enxerga o arco AC, de 80°.',
     add:['<span class="c-arc">arco AC</span> = 80°']},
    {say:'O ângulo oposto pelo vértice enxerga o arco BD, de 50°. Esse arco também conta.',
     add:['<span class="c-cd">arco BD</span> = 50°']},
    {say:'Regra: o ângulo é a soma dos dois arcos dividida por 2.',
     add:['<span class="c-ang">α</span> = '+F('<span class="c-arc">arco AC</span> + <span class="c-cd">arco BD</span>','2')]},
    {say:'Exemplo: arcos de 80° e 50°. Some e divida por 2.',
     add:['T:Exemplo','<span class="c-ang">α</span> = '+F('80° + 50°','2'),'<span class="c-ang">α</span> = '+F('130°','2')+' = <span class="c-res">65°</span>']}
  ]});

SCENES.push({id:'externo-ang',tab:'Ângulo externo',sub:'Ângulo excêntrico externo',
  build(){
    const Q=g=>[125+95*Math.cos(rad(g)),200-95*Math.sin(rad(g))];
    const B=Q(20),A=Q(130),C=Q(-20),D=Q(230),Pp=inter(B,A,C,D);

    path(arcD(130,230,95,125,200),2,'ln-arc');txt([125-62,200],'100°',2,'c-arc');

  steps:[

    {say:'Arco menor: é o arco BC, o mais próximo de P. Ele mede 40°.',

    {say:'Exemplo: arcos de 100° e 40°. Subtraia e divida por 2.',
     add:['T:Exemplo','<span class="c-ang">α</span> = '+F('100° − 40°','2'),'<span class="c-ang">α</span> = '+F('60°','2')+' = <span class="c-res">30°</span>']}
  ]});

/*MORE4*/
let scene=0,step=0;
const tabsEl=$('tabs'),dotsEl=$('dots'),sayEl=$('say'),linesEl=$('lines'),nextEl=$('next'),prevEl=$('prev'),extraEl=$('extra');
SCENES.forEach(S=>{S.grp=S.grp||'circ';});
SCENES.sort((a,b)=>GROUPS.findIndex(g=>g.id===a.grp)-GROUPS.findIndex(g=>g.id===b.grp));
const groupsEl=$('groups'),titleEl=$('title');
let navGroup=null;
function renderNav(){
  const g=SCENES[scene].grp;
  if(g!==navGroup){
    navGroup=g;groupsEl.replaceChildren();tabsEl.replaceChildren();
    GROUPS.forEach(G=>{
      const b=document.createElement('button');b.className='tab';b.textContent=G.name;b.dataset.g=G.id;
      b.addEventListener('click',()=>go(SCENES.findIndex(S=>S.grp===G.id)));groupsEl.appendChild(b);
    });
    SCENES.forEach((S,i)=>{
      if(S.grp!==g)return;
      const b=document.createElement('button');b.className='tab';b.textContent=S.tab;b.dataset.i=i;
      b.addEventListener('click',()=>go(i));tabsEl.appendChild(b);
    });
    titleEl.textContent=GROUPS.find(G=>G.id===g).title;
  }
  [...groupsEl.children].forEach(b=>b.setAttribute('aria-current',String(b.dataset.g===g)));
  [...tabsEl.children].forEach(b=>b.setAttribute('aria-current',String(+b.dataset.i===scene)));
  [groupsEl,tabsEl].forEach(r=>{
    const cur=r.querySelector('[aria-current="true"]');
    if(cur&&cur.scrollIntoView)cur.scrollIntoView({inline:'center',block:'nearest'});
  });
}

function go(i,last){
  scene=i;const S=SCENES[i];step=last?S.steps.length-1:0;
  SC.replaceChildren();S.build();
  $('sub').textContent=S.sub;
  linesEl.replaceChildren();
  S.steps.forEach((st,k)=>(st.add||[]).forEach(h=>{
    const d=document.createElement('div'),tag=h.startsWith('T:');
    d.className=tag?'tag':'line';d.innerHTML=tag?h.slice(2):h;d.dataset.k=k;d.hidden=true;linesEl.appendChild(d);
  }));
  dotsEl.replaceChildren();
  S.steps.forEach((_,k)=>{
    const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Passo '+(k+1));
    b.addEventListener('click',()=>{step=k;apply();});dotsEl.appendChild(b);
  });
  renderNav();
  if(location.hash!=='#'+S.id)location.hash=S.id;
  requestAnimationFrame(()=>requestAnimationFrame(apply));
}

function apply(){
  const S=SCENES[scene];
  SC.querySelectorAll('.el').forEach(el=>el.classList.toggle('on',step>=+el.dataset.s&&step<+el.dataset.e));
  sayEl.textContent=S.steps[step].say;
  sayEl.style.animation='none';void sayEl.offsetWidth;sayEl.style.animation='';
  linesEl.querySelectorAll('[data-k]').forEach(d=>{d.hidden=+d.dataset.k>step;});
  [...dotsEl.children].forEach((b,k)=>b.setAttribute('aria-current',String(k===step)));
  const lastStep=step===S.steps.length-1,lastScene=scene===SCENES.length-1;
  nextEl.textContent=!lastStep?'Próximo →':(lastScene?'Recomeçar ↺':'Próxima cena →');
  prevEl.disabled=scene===0&&step===0;
  extraEl.hidden=!(S.extra&&S.extra.show(step));
  if(S.extra)extraEl.textContent=S.extra.label;
}

function next(){
  const S=SCENES[scene];
  if(step<S.steps.length-1){step++;apply();}
  else go(scene<SCENES.length-1?scene+1:0);
}
function prev(){
  if(step>0){step--;apply();}
  else if(scene>0)go(scene-1,true);
}
nextEl.addEventListener('click',next);
prevEl.addEventListener('click',prev);
extraEl.addEventListener('click',()=>{const x=SCENES[scene].extra;if(x)x.click();});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){next();}else if(e.key==='ArrowLeft'){prev();}
});
window.addEventListener('hashchange',()=>{
  const i=SCENES.findIndex(S=>'#'+S.id===location.hash);
  if(i>=0&&i!==scene)go(i);
});
const i0=SCENES.findIndex(S=>'#'+S.id===location.hash);
go(i0>=0?i0:0);
</script>
